# SPDX-License-Identifier: EUPL-1.2
#
# The release of a version, started by pushing its tag (v1.2.0, v1.3.0-rc.1):
#
#   ci       all checks of ci.yml
#   files    the binaries, the SBOM, the licences and the release notes (tools/release.sh, as make release-local)
#   images   ghcr.io/OWNER/kogge and ghcr.io/OWNER/kogge-agent for linux/amd64 and linux/arm64, with BuildKit's SLSA
#            provenance (mode=max) and SBOM attestations; signed with cosign (keyless, with this workflow's identity)
#            and attested with the CycloneDX SBOM of each image (tools/sbom)
#   bundles  the offline bundles for both architectures (deploy/scripts/airgap-bundle.sh)
#   release  the GitHub release with all files, SHA256SUMS and its cosign signature bundle
#
# How operators verify what a release published is in README.de.md (cosign verify, verify-attestation, verify-blob).
# Every job gets the permissions it needs, nothing more; actions are pinned to the commits of their releases.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  COSIGN_VERSION: v3.1.4

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  files:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes need the tags and the commits since the previous release.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the files of the release
        env:
          KOGGE_RELEASE_IMAGES: "0"
          KOGGE_RELEASE_DIR: dist/files
        run: KOGGE_SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" tools/release.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: files
          path: dist/files/
          if-no-files-found: error
          retention-days: 3

  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign gets its certificate for this workflow's OIDC token.
      id-token: write
    outputs:
      server: ${{ steps.meta.outputs.server }}
      agent: ${{ steps.meta.outputs.agent }}
      server-digest: ${{ steps.server.outputs.digest }}
      agent-digest: ${{ steps.agent.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Describe the build
        id: meta
        run: |
          version=${GITHUB_REF_NAME#v}
          owner=${GITHUB_REPOSITORY_OWNER,,}
          server=ghcr.io/$owner/kogge
          agent=ghcr.io/$owner/kogge-agent
          # A release gets its version, its minor version and latest; a pre-release (1.3.0-rc.1) its version only.
          server_tags=$server:$version agent_tags=$agent:$version
          if [[ $version != *-* ]]; then
            minor=${version%.*}
            server_tags+=",$server:$minor,$server:latest" agent_tags+=",$agent:$minor,$agent:latest"
          fi
          {
            echo "version=$version"
            echo "server=$server"
            echo "agent=$agent"
            echo "server-tags=$server_tags"
            echo "agent-tags=$agent_tags"
            echo "commit=$GITHUB_SHA"
            echo "date=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "epoch=$(git log -1 --format=%ct)"
          } >>"$GITHUB_OUTPUT"
      - name: Build and push the server image
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          file: deploy/Dockerfile
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.server-tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Build and push the agent image
        id: agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          file: deploy/Dockerfile
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.agent-tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Sign the images and attest their SBOMs
        env:
          SERVER: ${{ steps.meta.outputs.server }}@${{ steps.server.outputs.digest }}
          AGENT: ${{ steps.meta.outputs.agent }}@${{ steps.agent.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p sbom
          for image in "$SERVER" "$AGENT"; do
            name=${image%@*}
            name=${name##*/}
            # The image index and each platform's image.
            cosign sign --yes --recursive "$image"
            docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' >"sbom/$name-index.json"
            for platform in linux/amd64 linux/arm64; do
              digest=$(jq -r --arg os "${platform%/*}" --arg arch "${platform#*/}" \
                '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest' "sbom/$name-index.json")
              ref=${image%@*}@$digest
              # The SBOM the build wrote into the image (Go modules, npm packages, Alpine packages).
              docker pull -q --platform "$platform" "$ref"
              container=$(docker create --platform "$platform" "$ref")
              docker cp "$container:/usr/share/doc/kogge/sbom.cdx.json" "sbom/$name-$VERSION-${platform/\//-}.cdx.json"
              docker rm -v "$container" >/dev/null
              cosign attest --yes --type cyclonedx --predicate "sbom/$name-$VERSION-${platform/\//-}.cdx.json" "$ref"
            done
            # The index gets the SBOMs of both platforms in one.
            go run ./tools/sbom -merge -o "sbom/$name-image-$VERSION.cdx.json" "sbom/$name-$VERSION-linux-amd64.cdx.json" \
              "sbom/$name-$VERSION-linux-arm64.cdx.json"
            cosign attest --yes --type cyclonedx --predicate "sbom/$name-image-$VERSION.cdx.json" "$image"
            rm "sbom/$name-index.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sboms
          path: sbom/*-image-*.cdx.json
          if-no-files-found: error
          retention-days: 3

  bundles:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the offline bundle
        env:
          PLATFORM: ${{ matrix.platform }}
          SERVER: ${{ needs.images.outputs.server }}@${{ needs.images.outputs.server-digest }}
          AGENT: ${{ needs.images.outputs.agent }}@${{ needs.images.outputs.agent-digest }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # The bundle names its images like a local build: kogge:VERSION and kogge-agent:VERSION.
          docker pull -q --platform "$PLATFORM" "$SERVER"
          docker pull -q --platform "$PLATFORM" "$AGENT"
          docker tag "$SERVER" "kogge:$version"
          docker tag "$AGENT" "kogge-agent:$version"
          KOGGE_SKIP_BUILD=1 KOGGE_BUNDLE_PLATFORM="$PLATFORM" KOGGE_BUNDLE_DIR=dist deploy/scripts/airgap-bundle.sh "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ strategy.job-index }}
          path: dist/*.tar
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  release:
    needs: [files, images, bundles]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The release and its files.
      contents: write
      # Keyless signing of SHA256SUMS.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Checksums and their signature
        working-directory: dist
        run: |
          mv release-notes.md "$RUNNER_TEMP/notes.md"
          rm -f SHA256SUMS ./*.sha256
          sha256sum -- * >"$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ needs.images.outputs.server }}
          AGENT: ${{ needs.images.outputs.agent }}
        run: |
          version=${GITHUB_REF_NAME#v}
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          issuer=https://token.actions.githubusercontent.com
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "### Verifying this release"
            echo
            echo "The images and SHA256SUMS are signed with cosign by this repository's release workflow:"
            echo
            echo '```sh'
            echo "cosign verify $SERVER:$version --certificate-identity $identity --certificate-oidc-issuer $issuer"
            echo "cosign verify-attestation --type cyclonedx $SERVER:$version --certificate-identity $identity --certificate-oidc-issuer $issuer"
            echo "cosign verify $AGENT:$version --certificate-identity $identity --certificate-oidc-issuer $issuer"
            echo "cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json --certificate-identity $identity --certificate-oidc-issuer $issuer"
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
          } >"$RUNNER_TEMP/body.md"
          prerelease=()
          [[ $version == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Kogge $version" \
            --notes-file "$RUNNER_TEMP/body.md" "${prerelease[@]}" -- *
