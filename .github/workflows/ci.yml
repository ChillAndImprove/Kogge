#
# The checks of every push and pull request; the release workflow (release.yml) runs them for a tag first. Actions
# are pinned to the commits of their releases (the version is in the comment).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kogge
          POSTGRES_PASSWORD: kogge
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kogge" --health-interval 5s --health-retries 20
    env:
      KOGGE_TEST_DATABASE_URL: postgres://kogge:kogge@localhost:5432/postgres?sslmode=disable
      KOGGE_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l cmd internal tools)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -timeout 15m ./...
      - name: Licences
        run: go run ./tools/golicenses

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Licences
        run: node tools/npm-licenses.mjs web
      - name: Lint, test and build
        run: npm run lint && npm test && npm run build
        working-directory: web

  # The browser tests (e2e/) against a Kogge with an empty database, in each browser.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kogge
          POSTGRES_PASSWORD: kogge
          POSTGRES_DB: kogge
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kogge" --health-interval 5s --health-retries 20
    env:
      KOGGE_E2E_BROWSER: ${{ matrix.browser }}
      KOGGE_E2E_URL: http://localhost:18080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build Kogge and the agent
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run build)
          go build -tags webui -o bin/kogge ./cmd/kogge
          go build -o bin/kogge-agent ./cmd/kogge-agent
      - name: Start Kogge
        run: |
          mkdir -p "$RUNNER_TEMP/kogge-data"
          KOGGE_DATABASE_URL="postgres://kogge:kogge@localhost:5432/kogge?sslmode=disable" \
            KOGGE_DATA_DIR="$RUNNER_TEMP/kogge-data" KOGGE_HTTP_ADDR=127.0.0.1:18080 KOGGE_SSH_ADDR=127.0.0.1:12222 \
            KOGGE_PUBLIC_URL=http://localhost:18080 KOGGE_AUTO_MIGRATE=true KOGGE_LOG_FORMAT=text \
            KOGGE_BOOTSTRAP_ADMIN_USERNAME=admin KOGGE_BOOTSTRAP_ADMIN_PASSWORD=Kogge-Dev-Secret-2026 \
            nohup bin/kogge serve > "$RUNNER_TEMP/kogge.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:18080/readyz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/kogge.log"; exit 1
      - name: Install the browser
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps "$KOGGE_E2E_BROWSER"
      - name: Browser tests
        working-directory: e2e
        run: npx playwright test
      - name: Keep the traces and the server log of failures
        if: failure()
        run: cp "$RUNNER_TEMP/kogge.log" e2e/test-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-${{ matrix.browser }}
          path: e2e/test-results/
          retention-days: 7

  # The Compose stack (deploy/compose.yaml) from start to finish with a new image: sign-in, an issue, pushes over
  # HTTP and SSH, single sign-on, a backup, and the client addresses behind a proxy on the host.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Smoke test of the Compose stack
        run: deploy/scripts/smoke-test.sh
