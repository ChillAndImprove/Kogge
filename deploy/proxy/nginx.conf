#
# Kogge and Keycloak behind nginx with TLS. In deploy/.env: KOGGE_PUBLIC_URL=https://kogge.example.com,
# KOGGE_SSO_URL=https://sso.example.com, KOGGE_HTTP_PUBLISH=127.0.0.1:8080 and KOGGE_SSO_PUBLISH=127.0.0.1:8081. The
# Compose stack trusts the X-Forwarded-For of a proxy on the Docker host (KOGGE_TRUSTED_PROXIES in .env.example); for
# nginx on another host, set it to that host's address. SSH (port 2222) is published directly, not through nginx.

upstream kogge {
    server 127.0.0.1:8080;
    keepalive 32;
}

# The editors of shared drafts talk to Kogge over WebSockets, which need the upgrade headers; other requests keep
# the connection to Kogge alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream keycloak {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    listen [::]:80;
    server_name kogge.example.com sso.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kogge.example.com;
    ssl_certificate     /etc/ssl/kogge/kogge.example.com.crt;
    ssl_certificate_key /etc/ssl/kogge/kogge.example.com.key;

    # Pushes, LFS objects, artifacts and attachments can be large; Kogge enforces its own limits.
    client_max_body_size 0;
    # Git, live updates, editors and build log streams need unbuffered, long-lived connections.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    location / {
        proxy_pass http://kogge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sso.example.com;
    ssl_certificate     /etc/ssl/kogge/sso.example.com.crt;
    ssl_certificate_key /etc/ssl/kogge/sso.example.com.key;

    # Keycloak's administration stays off the public address: administrators reach it on the host (e.g. through
    # an SSH tunnel to 127.0.0.1:8081); Kogge's directory sync uses the internal network.
    location /admin/ {
        return 404;
    }

    location / {
        proxy_pass http://keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        # Keycloak's responses carry large headers.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }
}
