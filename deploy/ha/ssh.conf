#
# nginx of compose.ha.yaml: SSH to the web nodes in turn. A node that does not take the connection is left out for
# ten seconds and the connection goes to the next one; the nodes share their host keys, so clients see one.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 1024;
}

stream {
	# Docker's DNS: a node created anew is found at its new address.
	resolver 127.0.0.11 valid=10s ipv6=off;
	upstream kogge_ssh {
		zone kogge_ssh 64k;
		server kogge:2222 resolve max_fails=1 fail_timeout=10s;
		server kogge-2:2222 resolve max_fails=1 fail_timeout=10s;
	}
	server {
		listen 2222;
		proxy_pass kogge_ssh;
		proxy_connect_timeout 3s;
		proxy_timeout 1h;
	}
}
